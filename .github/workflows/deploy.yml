name: Deploy Shiny app to GitHub Pages

# Builds app/ into a static WebAssembly site with shinylive and publishes it to
# a `gh-pages` branch. This avoids the GitHub Pages "environment" machinery
# (which is sensitive to the default-branch setting) and just pushes the built
# site to a branch that Pages serves.
#
# One-time setup: repo Settings ▸ Pages ▸ Source = "Deploy from a branch",
# Branch = "gh-pages" / "(root)".

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write        # needed to push the built site to gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install shinylive + app dependencies
        run: |
          install.packages(c("shinylive", "shiny", "bslib", "ggplot2", "leaflet"))
        shell: Rscript {0}

      - name: Export app to a static shinylive site
        run: |
          shinylive::export("app", "_site")
        shell: Rscript {0}

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
