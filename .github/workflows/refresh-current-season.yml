name: Refresh in-season soil-water map

# Runs the current-season pipeline weekly and commits the updated soil-water
# surface. That commit touches app/data/**, which triggers the deploy workflow,
# so the live site's "In-season soil water" tab refreshes automatically.
#
# Schedule: every MONDAY morning (UTC); the site updates Tuesday. Can also be
# run on demand from the Actions tab.
#
# NOTE: this needs the APSIM `Models` binary and the conditioned soils. It
# installs APSIM from the .deb committed under installers/ (add it if missing)
# and expects soils under simulation/data/raw/soil/ (produced by the historical
# pipeline). Tune current_season/config.R (N_CELLS) to keep the run within the
# Actions time budget.

on:
  schedule:
    - cron: "0 9 * * 1"      # 09:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-current-season
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install APSIM (Models CLI)
        run: |
          deb=$(ls installers/apsim-*.deb 2>/dev/null | head -1)
          if [ -z "$deb" ]; then
            echo "No APSIM .deb under installers/ — cannot run the in-season sim."
            echo "Add the .deb from the climate-change study to installers/ and re-run."
            exit 1
          fi
          sudo dpkg -i "$deb" || sudo apt-get -f install -y

      - name: Install R packages
        run: install.packages(c("apsimx","nasapower","soilDB","sf","dplyr","readr","doParallel","foreach"))
        shell: Rscript {0}

      - name: Run the in-season pipeline
        run: Rscript code/run-all.R
        working-directory: current_season

      - name: Commit the refreshed soil-water surface
        run: |
          if git diff --quiet -- app/data/soil-water.csv app/data/soil-water-meta.json; then
            echo "No change in the soil-water surface — nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/data/soil-water.csv app/data/soil-water-meta.json
            git commit -m "Auto-refresh in-season soil-water map"
            git push
          fi
